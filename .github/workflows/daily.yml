name: Daily momentum screen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 18:15 Asia/Kolkata, after the NSE session and Yahoo's daily close update.
    - cron: "15 12 * * 1-5"

concurrency:
  group: momentum-daily
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore cached market data
        uses: actions/cache@v4
        with:
          path: |
            data/*.pkl
            data/chunks
            data/no_price.txt
          key: momentum-data-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            momentum-data-v2-${{ runner.os }}-

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh price tail and NSE pool
        run: python scripts/fetch_data.py --refresh-pool

      - name: Rebuild daily screen
        run: python scripts/update_daily.py

      - name: Build GitHub Pages files
        run: python scripts/build_site.py

      - name: Commit and publish if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data/pool.csv
          if git diff --cached --quiet; then
            echo "No published changes"
          else
            git commit -m "Daily momentum screen refresh"
            git push
          fi
